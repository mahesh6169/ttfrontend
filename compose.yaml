# Local development: frontend + (via include) Mongo + backend.
#   docker compose up          (from this folder: starts all three)
# Expects ../ttbackendflyio next to this repo.
# Prod does NOT use this file: Vercel builds the app itself.
#
# One-time setup on a new machine:  docker network create edge
# The site is served by the Caddy container on the "edge" network, which
# also answers to telugufy.com.au inside that network, so server-side calls
# to https://telugufy.com.au/api reach the backend through Caddy.
name: tagtelugu

include:
  - ../ttbackendflyio/compose.yaml

services:
  tt-frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    volumes:
      - .:/app
      - tt-frontend-node-modules:/app/node_modules
      - tt-frontend-next:/app/.next
      # The e2e production build (build:e2e, NEXT_DIST_DIR=.next-e2e) writes
      # ~1.3 GB per run. In its own volume it stays out of the bind-mounted
      # repo folder and off the dev server's watched tree.
      - tt-frontend-next-e2e:/app/.next-e2e
    # Ceilings, not reservations: normal work never reaches them. They exist
    # so one runaway process (a dev server or a build) hits its cap instead of
    # starving the machine, which is shared with the tradeservice stack.
    # Room for the dev server's 3 GB heap plus the e2e build's 4 GB heap.
    cpus: 5
    mem_limit: 10g
    depends_on:
      - tt-backend
    networks:
      - edge

volumes:
  tt-frontend-node-modules:
  tt-frontend-next:
  tt-frontend-next-e2e:
